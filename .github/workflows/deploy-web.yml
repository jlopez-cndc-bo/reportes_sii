name: Build web package

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/reportes-sii' }}
  DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE || 'reportes-sii' }}
  DEPLOY_RUN_USER: ${{ vars.DEPLOY_RUN_USER || 'reportes' }}

jobs:
  build-test-package:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test backend
        working-directory: backend
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Create release package
        run: |
          mkdir -p release/web
          rsync -a \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'frontend/src' \
            --exclude 'frontend/public' \
            --exclude 'frontend/package-lock.json' \
            --exclude 'frontend/package.json' \
            --exclude 'frontend/vite.config.js' \
            ./ release/web/
          tar -C release -czf reportes-sii-web-${GITHUB_SHA}.tgz web

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: reportes-sii-web
          path: reportes-sii-web-${{ github.sha }}.tgz
          if-no-files-found: error
