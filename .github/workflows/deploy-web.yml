name: Build web package

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/reportes-sii' }}
  DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE || 'reportes-sii' }}
  DEPLOY_RUN_USER: ${{ vars.DEPLOY_RUN_USER || 'reportes' }}

jobs:
  build-test-package:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test backend
        working-directory: backend
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Create release package
        run: |
          package_root="$(mktemp -d)"
          mkdir -p "$package_root/web/frontend"

          rsync -a backend deploy README.md presentacion-migracion-web.html "$package_root/web/"
          rsync -a frontend/dist "$package_root/web/frontend/"

          tar -C "$package_root" -czf "reportes-sii-web-${GITHUB_SHA}.tgz" web
          rm -rf "$package_root"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: reportes-sii-web
          path: reportes-sii-web-${{ github.sha }}.tgz
          if-no-files-found: error
